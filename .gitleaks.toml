title = "Gitleaks config for ai-agent-observability"

[extend]
useDefault = true

# ============================================
# Allowlist: 許可パターン（誤検知を防ぐ、最小限）
# ============================================

[allowlist]
description = "Allowlist for example/template files only"

paths = [
    '''monitoring/\.env\.example''',
]

regexes = [
    '''GF_ALERTING_DISCORD_WEBHOOK_URL=\s*$''',
]

# ============================================
# Custom Rules: カスタム検出ルール（SEC-001完了条件5）
# ============================================

[[rules]]
id = "ssh-private-key"
description = "SSH/PGP private key block"
regex = '''-----BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----'''
tags = ["ssh", "private-key", "secret"]

[[rules]]
id = "pem-private-key-block"
description = "Generic PEM private key block (not a public certificate)"
regex = '''-----BEGIN PRIVATE KEY-----'''
tags = ["pem", "private-key", "secret"]

[[rules]]
id = "tailscale-auth-key"
description = "Tailscale auth key (tskey-)"
regex = '''tskey-[a-zA-Z0-9\-]{20,}'''
tags = ["tailscale", "auth-key", "secret"]

[[rules]]
id = "discord-webhook-url"
description = "Discord Webhook URL"
regex = '''https://discord(?:app)?\.com/api/webhooks/[0-9]+/[a-zA-Z0-9_\-]+'''
tags = ["discord", "webhook", "secret"]

[[rules]]
id = "cloudflare-tunnel-token"
description = "Cloudflare Tunnel token (base64 JSON with AccountTag/TunnelSecret)"
regex = '''(?i)(tunnel[_-]?token|TUNNEL_TOKEN)\s*[=:]\s*['"]?ey[A-Za-z0-9+/=]{40,}'''
tags = ["cloudflare", "tunnel-token", "secret"]

[[rules]]
id = "cloudflared-tunnel-secret"
description = "cloudflared credentials.json TunnelSecret"
regex = '''"TunnelSecret"\s*:\s*"[A-Za-z0-9+/=]{20,}"'''
tags = ["cloudflare", "cloudflared", "secret"]

[[rules]]
id = "grafana-service-account-token"
description = "Grafana service account token (glsa_)"
regex = '''glsa_[A-Za-z0-9_]{32,}'''
tags = ["grafana", "api-token", "secret"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key (variable-name based, since the value itself has no fixed prefix)"
regex = '''(?i)aws_secret_access_key\s*[=:]\s*['"]?[A-Za-z0-9/+=]{40}'''
tags = ["aws", "secret-key", "secret"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-api03-...)"
regex = '''sk-ant-api03-[A-Za-z0-9_\-]{20,}'''
tags = ["anthropic", "api-key", "secret"]

# ============================================
# Custom Rules: 補助（多agent-shogun運用実績があるAPIキー系）
# ============================================

[[rules]]
id = "generic-api-key-assignment"
description = "Generic API key pattern (api_key = 'xxx')"
regex = '''(?i)api[_-]?key\s*[=:]\s*['"][a-zA-Z0-9_\-\.]{20,}['"]'''
tags = ["api-key", "secret"]

[[rules]]
id = "generic-password"
description = "Generic password/secret/token assignment pattern (quote optional, .env-style)"
regex = '''(?i)(password|passwd|pwd|secret|token)\s*[=:]\s*['"]?[^\s'"]{8,}'''
tags = ["password", "secret"]
